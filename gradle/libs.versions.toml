[versions]
agp = "9.2.1"
zxing = "3.5.3"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxRunner = "1.7.0"
wearOngoing = "1.1.0"
splashscreen = "1.2.0"
androidxCore = "1.17.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-runner = { module = "androidx.test:runner", version.ref = "androidxRunner" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
